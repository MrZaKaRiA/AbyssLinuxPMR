# Abyss Linux login screen (lightdm-gtk-greeter 2.0), installed as
# /etc/lightdm/lightdm-gtk-greeter.conf.d/50-abyss.conf by abyss-theme.
#
# The greeter reads lightdm-gtk-greeter.conf.d/*.conf first and
# /etc/lightdm/lightdm-gtk-greeter.conf last, so a key in that main file
# replaces the one here: keep it for your own changes only.
#
# Size: do NOT set xft-dpi here, it would replace the display scale. LightDM
# runs abyss-display-setup on the login screen's X server before the greeter
# starts; it merges Xft.dpi from abyss-scale (100% on a normal monitor or a
# Mac VM window on one, 200% on a Retina-sized screen). The look (the card and
# the top line) is in the Abyss GTK theme, sized in em so it follows that scale.
[greeter]
# 5120x2160 picture: the greeter zooms it to fill the screen (no stretching)
# and crops the sides on 16:10 and 16:9 screens.
background=/usr/share/backgrounds/abyss/abyss-orbit.jpg
user-background=false
theme-name=Abyss
icon-theme-name=Abyss
cursor-theme-name=Adwaita
font-name=Inter,Sans 11
xft-antialias=true
xft-hintstyle=hintslight
xft-rgba=none
# The user picture is a fixed 80 px image that does not follow the display
# scale; the card shows the user's name instead.
hide-user-image=true
round-user-image=true
default-user-image=#avatar-default-symbolic
position=50%,center 50%,center
# Top line: clock in the middle; keyboard layout, accessibility and the
# power menu (suspend, restart, shut down) on the right.
panel-position=top
indicators=~spacer;~clock;~spacer;~layout;~a11y;~power
clock-format=%a %d %b  %H:%M
screensaver-timeout=0
