<?xml version="1.0" encoding="UTF-8"?>
<!-- Abyss Linux logo: three glowing orbit rings drifting to the lower right
     around a bright core. Transparent background, 180x180 user units.
     Rendered to the PNGs next to it by make-logo-png.sh (not installed). -->
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="ring1" gradientUnits="userSpaceOnUse" x1="36" y1="36" x2="144" y2="144">
      <stop offset="0" stop-color="#dc9ffc"/>
      <stop offset="0.15" stop-color="#cd89fb"/>
      <stop offset="0.5" stop-color="#a755f7"/>
      <stop offset="0.85" stop-color="#865df4"/>
      <stop offset="1" stop-color="#7861f3"/>
    </linearGradient>
    <linearGradient id="ring2" gradientUnits="userSpaceOnUse" x1="57.5" y1="57.5" x2="133.5" y2="133.5">
      <stop offset="0" stop-color="#c68de8"/>
      <stop offset="0.15" stop-color="#b97be7"/>
      <stop offset="0.5" stop-color="#9a4ee3"/>
      <stop offset="0.85" stop-color="#7d56e1"/>
      <stop offset="1" stop-color="#7359e3"/>
    </linearGradient>
    <linearGradient id="ring3" gradientUnits="userSpaceOnUse" x1="77.5" y1="77.5" x2="122.5" y2="122.5">
      <stop offset="0" stop-color="#b37dd5"/>
      <stop offset="0.15" stop-color="#a66cd3"/>
      <stop offset="0.5" stop-color="#8b47ce"/>
      <stop offset="0.85" stop-color="#734ccd"/>
      <stop offset="1" stop-color="#6a50cd"/>
    </linearGradient>
    <radialGradient id="core" cx="0.42" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#fbe2ff"/>
      <stop offset="0.7" stop-color="#f5c2ff"/>
      <stop offset="1" stop-color="#eeb2fd"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" result="tint"
        values="0 0 0 0 0.56  0 0 0 0 0.24  0 0 0 0 0.92  0 0 0 0.55 0"/>
      <feMerge>
        <feMergeNode in="tint"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" fill="none" stroke-width="8">
    <circle cx="90" cy="90" r="54" stroke="url(#ring1)"/>
    <circle cx="95.5" cy="95.5" r="38" stroke="url(#ring2)"/>
    <circle cx="100" cy="100" r="22.5" stroke="url(#ring3)"/>
    <circle cx="102.5" cy="102.5" r="9" fill="url(#core)" stroke="none"/>
  </g>
</svg>
