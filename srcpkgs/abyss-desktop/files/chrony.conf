# chronyd's configuration on Abyss Linux, chosen by /etc/sv/chronyd/conf.
# Everything in /etc/chrony.conf applies: change settings there, not here.
include /etc/chrony.conf

# Step the clock whenever it is more than a second off, not only during the
# first three updates. A virtual machine's clock stops while the host
# sleeps; without this chronyd would slew a 20-minute error for hours.
makestep 1.0 -1
