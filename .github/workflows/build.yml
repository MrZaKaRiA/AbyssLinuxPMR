name: Build and publish packages

# Every push to main that touches a template rebuilds all Abyss packages for
# x86_64 and aarch64, signs the repository and publishes it on GitHub Pages:
#   https://mrzakaria.github.io/AbyssLinuxPMR/current
# Pull requests only build (no signing key, no publishing).

on:
  push:
    branches: [main]
    paths: ['srcpkgs/**', 'common/**', 'keys/**', 'site/**', '.github/workflows/**']
  pull_request:
    paths: ['srcpkgs/**', 'common/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pmr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build x86_64 + aarch64
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full
      options: --privileged
      volumes:
        - /dev:/dev

    steps:
      - name: Prepare container
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          xbps-install -Syu xbps && xbps-install -yu && xbps-install -y sudo bash curl git
          useradd -G xbuilder -M builder

      - uses: actions/checkout@v4

      - name: Build packages
        run: bash common/build.sh

      - name: Test shortcut editor and real X11 bindings
        run: |
          xbps-install -Sy xorg-server-xvfb xvfb-run xdotool dejavu-fonts-ttf python3 gcc pkg-config libX11-devel zenity dbus
          ABYSS_EDITOR="$PWD/srcpkgs/abyss-desktop/files/bin/abyss-shortcut-editor" ABYSS_SHORTCUT_LIST="$PWD/srcpkgs/abyss-desktop/files/bin/abyss-shortcuts" python3 tests/test_shortcut_editor.py
          ABYSS_IMG="$PWD/srcpkgs/abyss-desktop/files/bin/img" ABYSS_APPS="$PWD/srcpkgs/abyss-desktop/files/bin/abyss-apps" ABYSS_IMAGES_DESKTOP="$PWD/srcpkgs/abyss-desktop/files/abyss-images.desktop" python3 tests/test_image_launcher.py
          ABYSS_CENTER="$PWD/srcpkgs/abyss-desktop/files/bin/abyss-control-center" python3 tests/test_app_shortcuts.py
          ABYSS_CENTER="$PWD/srcpkgs/abyss-desktop/files/bin/abyss-control-center" python3 tests/test_text_size.py
          ABYSS_THUNAR_INIT="$PWD/srcpkgs/abyss-desktop/files/bin/abyss-thunar-init" python3 tests/test_thunar_init.py
          ABYSS_CHOOSER_INIT="$PWD/srcpkgs/abyss-desktop/files/bin/abyss-file-chooser-init" python3 tests/test_file_chooser_init.py
          cc -std=c99 -Wall -Wextra tests/dialog-window.c $(pkg-config --cflags --libs x11) -o /tmp/abyss-dialog-window-test
          cc -std=c99 -Wall -Wextra -Wno-unused-function tests/shortcut-config.c $(pkg-config --cflags --libs x11) -o /tmp/abyss-shortcut-config-test
          /tmp/abyss-shortcut-config-test
          mkdir -p /usr/local/bin
          printf '#!/bin/sh\nold shortcut script\n' > /usr/local/bin/abyss-shortcuts
          ln -s abyss-shortcuts /usr/local/bin/abyss-welcome
          xbps-install -y -R /tmp/void-packages/hostdir/binpkgs abyss-dwm lightdm-gtk-greeter
          grep -Fx 'exec /usr/bin/abyss-shortcuts "$@"' /usr/local/bin/abyss-shortcuts
          grep -Fx 'exec /usr/bin/abyss-welcome "$@"' /usr/local/bin/abyss-welcome
          tests/shortcuts-x11.sh
          cc -std=c99 -Wall -Wextra tests/zenity-luminance.c $(pkg-config --cflags --libs x11) -o /tmp/abyss-zenity-luminance
          ABYSS_SESSION="$PWD/srcpkgs/abyss-desktop/files/bin/abyss-session" LUMINANCE=/tmp/abyss-zenity-luminance xvfb-run -a dbus-run-session -- tests/zenity-dark-x11.sh

      - name: Sign repository
        if: github.event_name != 'pull_request'
        env:
          XBPS_SIGNING_KEY: ${{ secrets.XBPS_SIGNING_KEY }}
        run: bash common/sign.sh public/current

      - name: Assemble site
        if: github.event_name != 'pull_request'
        run: |
          cp -r site/. public/
          mkdir -p public/keys
          cp keys/abyss-pmr.plist keys/abyss-pmr.pub.pem keys/FINGERPRINT public/keys/
          cp keys/abyss-pmr.plist "public/keys/$(cat keys/FINGERPRINT).plist"
          { echo '<!doctype html><meta charset="utf-8"><title>Abyss PMR - current</title><pre>'
            (cd public/current && ls -l --time-style=+%F | awk 'NR>1 {printf "<a href=\"%s\">%s</a>  %s  %s\n", $7, $7, $6, $5}')
            echo '</pre>'; } > public/current/index.html
          ls -lR public

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: public

  thunar-preview:
    name: Test real Thunar layout
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full
    steps:
      - name: Prepare X11 and Thunar
        run: |
          mkdir -p /etc/xbps.d && cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          xbps-install -Syu xbps && xbps-install -yu
          xbps-install -y Thunar xfconf xdg-user-dirs xrdb xrandr xvfb-run xdotool dbus gcc pkg-config libX11-devel papirus-icon-theme dwm dejavu-fonts-ttf
      - uses: actions/checkout@v4
      - name: Test and capture Thunar
        run: |
          mkdir -p /usr/share/themes/Abyss/gtk-3.0 /tmp/abyss-thunar-preview
          cp srcpkgs/abyss-theme/files/index.theme /usr/share/themes/Abyss/
          cp srcpkgs/abyss-theme/files/gtk-3.0/gtk.css /usr/share/themes/Abyss/gtk-3.0/
          cc -std=c99 -Wall -Wextra tests/x11-screenshot.c $(pkg-config --cflags --libs x11) -o /tmp/abyss-x11-screenshot
          ABYSS_THUNAR_INIT="$PWD/srcpkgs/abyss-desktop/files/bin/abyss-thunar-init" SCREENSHOT=/tmp/abyss-x11-screenshot OUTPUT=/tmp/abyss-thunar-preview/thunar.ppm xvfb-run -a -s '-screen 0 1600x1000x24 -noreset' dbus-run-session -- tests/thunar-x11.sh
      - name: Save Thunar preview
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: thunar-preview
          path: /tmp/abyss-thunar-preview/thunar.ppm
          if-no-files-found: warn

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: [build, thunar-preview]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
